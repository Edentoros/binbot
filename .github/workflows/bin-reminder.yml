name: Bin reminder

# Started at 20:00 UK time every Tuesday by an external timer (cron-job.org)
# calling GitHub's workflow_dispatch API with test=false. GitHub's own
# schedule trigger isn't used: it can start runs hours late.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test: send a preview of the next reminder (untick to send the real reminder for tomorrow)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Send reminder
        run: python3 bin_reminder.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ inputs.test }}
